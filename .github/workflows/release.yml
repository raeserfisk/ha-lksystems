name: Create Release

on:
  push:
    branches:
      - main
    paths:
      - "custom_components/lksystems/manifest.json"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example 0.4.0)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release commit
        uses: actions/checkout@v4

      - name: Resolve and validate version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          MANIFEST_VERSION=$(python3 -c 'import json; print(json.load(open("custom_components/lksystems/manifest.json"))["version"])')
          VERSION="${INPUT_VERSION#v}"
          if [ -z "$VERSION" ]; then
            VERSION="$MANIFEST_VERSION"
          fi
          if [ "$VERSION" != "$MANIFEST_VERSION" ]; then
            echo "Release version $VERSION does not match manifest version $MANIFEST_VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG_NAME=v$VERSION" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists; nothing to do."
            exit 0
          fi
          gh release create "$TAG_NAME" \
            --target "$GITHUB_SHA" \
            --title "$TAG_NAME" \
            --generate-notes
